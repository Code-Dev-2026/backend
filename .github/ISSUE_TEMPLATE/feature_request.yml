name: Requerimiento / Característica Backend
description: Propón una nueva funcionalidad o caso de uso backend.
title: "feat(<módulo>): <descripción concisa>"
labels: ["requirement"]
body:
  - type: markdown
    attributes:
      value: |
        ### Plantilla de Requerimiento Backend
        Por favor diligencia cada sección asegurando trazabilidad y principios SOLID.
  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Antecedentes del dominio y justificación del requerimiento.
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Qué se busca lograr y cuál es el resultado de negocio esperado.
    validations:
      required: true
  - type: textarea
    id: solid_principles
    attributes:
      label: Principios SOLID Aplicados
      description: Detalla cómo se aplican SRP, OCP, LSP, ISP y DIP en este diseño.
    validations:
      required: true
  - type: textarea
    id: security_criteria
    attributes:
      label: Criterios de Seguridad
      description: Control de acceso, validación de entrada o inmutabilidad requerida.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Criterios de Aceptación (BDD / Gherkin)
      description: Escenarios Dado / Cuando / Entonces.
    validations:
      required: true
