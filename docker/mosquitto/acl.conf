# ============================================================================
# Política ACL de Tópicos MQTT — OWASP ASVS V10.3
# Proyecto: Camino Seguro — Issue #12
# ============================================================================

# El servicio backend solo tiene permiso de suscripción (lectura) sobre telemetría vehicular
user backend_telemetry
topic read telemetry/vehicles/+/gps

# Cada vehículo/dispositivo autenticado (%u = placa del vehículo, ej. WKK123)
# queda restringido a publicar exclusivamente en su propio tópico
pattern write telemetry/vehicles/%u/gps
