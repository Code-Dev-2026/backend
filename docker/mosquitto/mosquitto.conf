# ============================================================================
# Eclipse Mosquitto 2.x — Broker MQTT con mTLS y ACL por Vehículo
# Proyecto: Camino Seguro — Issue #12 (OWASP ASVS V10.3)
# ============================================================================

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Seguridad obligatoria: sin acceso anónimo, credenciales y ACL estrictas
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Listener MQTTS (TLS >= 1.2 + autenticación mutua de certificados cliente)
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username false
tls_version tlsv1.2
